name: Build Floating Volume APK

on:
  push:
    branches:
      - fix/overlay-seekbar-commit-on-release-20261117
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36.1
        run: |
          sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0"

      - name: Create temporary debug signing key
        run: |
          keytool -genkeypair -noprompt -v \
            -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Package APK and checksum
        run: |
          mkdir -p dist
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/FloatingVolume-1.0.1-popup-fix-debug.apk
          cd dist
          sha256sum FloatingVolume-1.0.1-popup-fix-debug.apk > FloatingVolume-1.0.1-popup-fix-debug.apk.sha256

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatingVolume-1.0.1-popup-fix-debug
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-popup-fix-debug
          target_commitish: ${{ github.sha }}
          name: Floating Volume 1.0.1 — Popup volume fix (test)
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/FloatingVolume-1.0.1-popup-fix-debug.apk
            dist/FloatingVolume-1.0.1-popup-fix-debug.apk.sha256
          body: |
            This is an experimental debug APK built from the popup SeekBar fix branch.
            The slider now commits volume once on release, defers verification and logs rejected volume commands.
            Test on the target phone before merging the fix.
            The debug signing key is generated during CI and may differ from the previous APK signature;
            uninstall an older debug build first if Android reports an update-signature mismatch.
